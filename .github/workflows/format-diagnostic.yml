name: Format diff diagnostic

on:
  push:
    branches:
      - fix/stable-improvement-results-18

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Print format diff
        run: |
          dart format lib/domain.dart test/mutation_controller_test.dart
          git diff -- lib/domain.dart test/mutation_controller_test.dart
          test -z "$(git status --short --untracked-files=no)"
